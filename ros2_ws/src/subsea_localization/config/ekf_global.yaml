ekf_global:
  ros__parameters:
    frequency: 100.0
    sensor_timeout: 0.5
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map

    # Fuse local odometry (position + velocity) with GPS-derived odometry in global frame.
    # IMU is intentionally excluded here — it is already fused in ekf_local and its
    # output is carried through /odometry/local. Including it here double-counts it.
    odom0: /odometry/local
    odom0_config: [true,  true,  true,
                   true,  true,  true,
                   true,  true,  true,
                   true,  true,  true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    odom1: /odometry/gps
    odom1_config: [true,  true,  true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false

    use_control: false
    stamped_control: false
    permit_corrected_publication: true
